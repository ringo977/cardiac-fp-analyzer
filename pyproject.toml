[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cardiac-fp-analyzer"
version = "3.23.0"
description = "Field Potential analysis pipeline for hiPSC-CM micro-ECG recordings"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Marco Rasponi", email = "marco.rasponi@gmail.com" },
]
keywords = [
    "electrophysiology", "hiPSC-CM", "cardiomyocyte", "field-potential",
    "MEA", "CiPA", "cardiac-safety", "CDISC", "SEND",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy>=1.22,<2.0",
    "pandas>=1.4,<3.0",
    "scipy>=1.8,<2.0",
    "matplotlib>=3.5,<4.0",
]

[project.optional-dependencies]
# Desktop GUI (PySide6 + PyQtGraph) — the primary UI since ADR-0001.
gui = [
    "PySide6>=6.5,<7.0",
    "pyqtgraph>=0.13,<0.14",
]
# Legacy web GUI (Streamlit app.py) — maintenance only, no new features.
streamlit = [
    "streamlit>=1.24,<2.0",
    "plotly>=5.0,<6.0",
]
# Excel/PDF reports
reports = [
    "xlsxwriter>=3.0,<4.0",
]
# CDISC SEND export (.xpt files)
cdisc = [
    "pyreadstat>=1.2,<2.0",
]
# Multi Channel Systems HDF5 raw-data files (.h5)
mcs = [
    "h5py>=3.0,<4.0",
]
# NWB 2 files: reading needs only h5py; the CSV → .nwb converter needs pynwb
nwb = [
    "h5py>=3.0,<4.0",
    "pynwb>=2.6",
    "tzdata",          # zoneinfo has no time-zone database on Windows
]
# Everything
all = [
    "cardiac-fp-analyzer[gui,streamlit,reports,cdisc,mcs,nwb]",
]
# Development / testing
dev = [
    "cardiac-fp-analyzer[all]",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "openpyxl>=3.0",          # reads the exported workbooks back in the tests
    "ruff>=0.1.0",
]

[project.urls]
Repository = "https://github.com/ringo977/cardiac-fp-analyzer"

[project.scripts]
cardiac-fp = "cardiac_fp_analyzer.analyze:main"
cardiac-fp-gui = "pyside_app.main:main"
cardiac-fp-results = "cardiac_fp_analyzer.results_export:main"
cardiac-fp-nwb = "cardiac_fp_analyzer.nwb_io:main"
cardiac-fp-nwb-gui = "pyside_app.nwb_converter:main"

[tool.setuptools.packages.find]
include = ["cardiac_fp_analyzer*", "pyside_app*", "ui*"]

# ── Ruff (linting + formatting) ──
[tool.ruff]
target-version = "py39"
line-length = 100
src = [".", "cardiac_fp_analyzer", "pyside_app"]
extend-exclude = ["*.app"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # line too long — handled by formatter where possible
    "E701",   # multiple statements on one line — used for compact config
    "E702",   # multiple statements on one line (semicolon) — compact config
    "E741",   # ambiguous variable names (l, O, I) — common in scientific code
    "F541",   # f-string without placeholders — harmless
    "B007",   # unused loop variable — common in scientific iteration
    "B023",   # function def does not bind loop variable — acceptable pattern
    "B028",   # no stacklevel in warnings — not critical
    "SIM102", # collapsible if — nested form preferred for readability
    "SIM108", # ternary operator — explicit if/else preferred for clarity
]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E402"]  # Streamlit requires st.set_page_config() before UI imports

[tool.ruff.lint.isort]
known-first-party = ["cardiac_fp_analyzer", "pyside_app", "tests"]

# ── Pytest ──
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
