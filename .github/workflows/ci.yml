# Continuous Integration — cardiac-fp-analyzer
#
# Runs on main and on every feat/** and fix/** branch, so the branch where
# development actually happens is tested — not only the one the badge
# points at.
#
# The desktop GUI (PySide6) is installed and exercised headless
# (QT_QPA_PLATFORM=offscreen). Until Oct 2026 PySide6 was not installed
# in CI and every GUI test began with importorskip, so ~30 % of the suite
# was silently skipped while the badge stayed green. The "skip budget"
# step below fails the job if more than a handful of tests are skipped.

name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_QPA_PLATFORM: offscreen
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: System libraries for headless Qt
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 \
            libglib2.0-0 libxcb-cursor0
      - name: Install package (core + desktop GUI + reports) and test tools
        run: |
          pip install -e ".[gui,reports]"
          pip install pytest pytest-cov
      - name: Run tests
        run: pytest tests/ -v --tb=short -rs --junitxml=pytest.xml
      - name: Skip budget (GUI tests must actually run)
        run: |
          python - <<'EOF'
          import xml.etree.ElementTree as ET, sys
          root = ET.parse('pytest.xml').getroot()
          suite = root if root.tag == 'testsuite' else root.find('testsuite')
          tests, skipped = int(suite.get('tests', 0)), int(suite.get('skipped', 0))
          print(f"collected={tests} skipped={skipped}")
          # A few environment-dependent skips (e.g. optional pyreadstat) are fine.
          if skipped > 15:
              sys.exit(f"{skipped} tests skipped — GUI tests are being bypassed")
          EOF
